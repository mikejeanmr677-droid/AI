<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大模型 API 管理平台</title>
  <style>
    :root { --bg:#f5f6f8; --card:#fff; --border:#e5e7eb; --text:#1f2937; --muted:#6b7280; --brand:#2563eb; --green:#16a34a; --red:#dc2626; --amber:#d97706; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); font-size:14px; }
    header { background:var(--card); border-bottom:1px solid var(--border); padding:16px 24px; display:flex; align-items:center; justify-content:space-between; }
    header h1 { font-size:18px; }
    .container { max-width:1200px; margin:24px auto; padding:0 24px; }
    .tabs { display:flex; gap:8px; margin-bottom:20px; }
    .tab { padding:8px 16px; background:var(--card); border:1px solid var(--border); border-radius:8px; cursor:pointer; color:var(--muted); }
    .tab.active { background:var(--brand); color:#fff; border-color:var(--brand); }
    .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:20px; margin-bottom:20px; }
    .card h2 { font-size:15px; margin-bottom:14px; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--border); }
    th { color:var(--muted); font-weight:500; font-size:12px; }
    button { padding:6px 14px; border:1px solid var(--border); background:var(--card); border-radius:6px; cursor:pointer; }
    button.primary { background:var(--brand); color:#fff; border-color:var(--brand); }
    button.danger { color:var(--red); border-color:var(--red); }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:12px; }
    .badge.ok { background:#ecfdf5; color:var(--green); }
    .badge.warn { background:#fffbeb; color:var(--amber); }
    .badge.err { background:#fef2f2; color:var(--red); }
    .badge.info { background:#eff6ff; color:var(--brand); }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
    input, select { padding:8px 10px; border:1px solid var(--border); border-radius:6px; width:100%; }
    .field { margin-bottom:12px; }
    .field label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
    .stat { font-size:28px; font-weight:700; }
    .muted { color:var(--muted); }
    .row-actions { display:flex; gap:6px; }
    .status-pending { color:var(--amber); }
    .status-notified { color:var(--brand); }
    .status-paid { color:#7c3aed; }
    .status-credited { color:var(--green); }
    .status-failed { color:var(--red); }
    .hidden { display:none; }
    .picon { width:20px; height:20px; display:inline-block; vertical-align:-4px; margin-right:8px; flex-shrink:0; }
    .pname { display:inline-flex; align-items:center; }
  </style>
</head>
<body>
  <header>
    <h1>大模型 API 统一管理平台</h1>
    <div id="fund-badge" class="muted">资金池：--</div>
  </header>

  <div class="container">
    <div class="tabs">
      <div class="tab active" data-tab="platforms">平台面板</div>
      <div class="tab" data-tab="orders">充值单</div>
      <div class="tab" data-tab="fund">资金池</div>
    </div>

    <!-- 平台面板 -->
    <section id="tab-platforms">
      <div class="card">
        <h2>大模型平台</h2>
        <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:8px;" id="quick-add-bar">
          <span style="font-size:13px; color:#6b7280;">⚡ 快速添加：</span>
          <button class="primary" onclick="showAddForm()">+ 添加平台</button>
        </div>
        <div id="add-form" class="card hidden" style="margin-top:16px;">
          <h2 id="form-title">添加平台</h2>
          <div id="form-hint" class="hidden" style="background:#f0f7ff; border:1px solid #bfdbfe; border-radius:6px; padding:10px 14px; font-size:13px; color:#1e40af; margin-bottom:12px; line-height:1.7;"></div>
          <div class="grid" id="form-grid">
            <div class="field" data-field="name"><label>平台名称 *</label><input id="f-name" placeholder="如 OpenAI"></div>
            <div class="field" data-field="provider"><label>Provider</label>
              <select id="f-provider">
                <option value="openai">openai</option>
                <option value="anthropic">anthropic</option>
                <option value="google">google</option>
                <option value="tencent">tencent（腾讯云/混元）</option>
                <option value="dashscope">dashscope（阿里云百炼）</option>
                <option value="volcengine">volcengine（火山引擎）</option>
                <option value="moonshot">moonshot（月之暗面/Kimi）</option>
                <option value="minimax">minimax（MiniMax）</option>
                <option value="generic">generic（通用）</option>
              </select>
            </div>
            <div class="field" data-field="key"><label id="f-key-label">API Key <a href="https://platform.deepseek.com/api_keys" target="_blank" rel="noopener noreferrer" style="font-size:12px;color:var(--brand);margin-left:4px;">查看帮助</a></label><input id="f-key" placeholder="sk-"></div>
            <div class="field" data-field="key-secret"><label id="f-key-secret-label">Secret Key（火山 SK，可选）</label><input id="f-key-secret" placeholder="火山引擎填 Secret Access Key"></div>
            <div class="field" data-field="balance-type"><label>余额类型</label>
              <select id="f-balance-type">
                <option value="api">api（官方接口）</option>
                <option value="manual">manual（手动录入）</option>
                <option value="scrape">scrape（抓取）</option>
              </select>
            </div>
            <div class="field" data-field="balance-url"><label>余额查询 URL</label><input id="f-balance-url" placeholder="https://..."></div>
            <div class="field" data-field="json-path"><label>余额 JSON path</label><input id="f-json-path" placeholder="如 total_available"></div>
            <div class="field" data-field="currency"><label>币种</label><input id="f-currency" value="USD"></div>
            <div class="field" data-field="threshold"><label>充值阈值</label><input id="f-threshold" type="number" value="200"></div>
            <div class="field" data-field="recharge"><label>充值金额</label><input id="f-recharge" type="number" value="500"></div>
            <div class="field" data-field="target"><label>补足目标（可选）</label><input id="f-target" type="number" placeholder="留空=固定金额"></div>
          </div>
          <button class="primary" id="form-save-btn" onclick="savePlatform()">保存</button>
          <button onclick="hideAddForm()">取消</button>
        </div>
        <table style="margin-top:16px;" id="platform-table">
          <thead><tr><th>名称</th><th>Provider</th><th>余额</th><th>阈值</th><th>充值金额</th><th>状态</th><th>操作</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <!-- 充值单 -->
    <section id="tab-orders" class="hidden">
      <div class="card">
        <h2>充值单</h2>
        <button class="primary" onclick="runMonitor()">立即巡检</button>
        <table style="margin-top:16px;" id="order-table">
          <thead><tr><th>单号</th><th>平台</th><th>金额</th><th>状态</th><th>原因</th><th>时间</th><th>操作</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <!-- 资金池 -->
    <section id="tab-fund" class="hidden">
      <div class="card">
        <h2>公司资金池</h2>
        <div class="stat" id="fund-balance">--</div>
        <div class="field" style="margin-top:16px; max-width:320px;">
          <label>预存金额</label>
          <input id="deposit-amount" type="number" placeholder="金额">
        </div>
        <button class="primary" onclick="deposit()">预存</button>
        <table style="margin-top:16px;" id="fund-table">
          <thead><tr><th>类型</th><th>金额</th><th>结余</th><th>说明</th><th>时间</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </div>

  <script>
    const API = '';
    async function api(path, opts = {}) {
      const hasBody = opts.body !== undefined;
      const res = await fetch(API + path, {
        headers: hasBody ? { 'Content-Type': 'application/json' } : {},
        ...opts,
        body: hasBody ? JSON.stringify(opts.body) : undefined,
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || `HTTP ${res.status}`);
      }
      return res.json();
    }

    const STATUS_LABEL = { pending:'待通知', notified:'已通知', paid:'已打款', credited:'已到账', failed:'失败' };
    const STATUS_CLASS = { pending:'status-pending', notified:'status-notified', paid:'status-paid', credited:'status-credited', failed:'status-failed' };

    // 平台图标：内嵌简化品牌 SVG（离线可用），按 provider/名称匹配
    const ICONS = {
      deepseek: '<svg class="picon" viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#4D6BFE"/><path d="M17.5 8.5c-.6-1-1.8-1.7-3-1.8-.5-.1-1 0-1.5.1-1.4.3-2.5 1.2-3 2.4-.2.5-.3 1-.2 1.5-1.4-.2-2.6-.9-3.5-2 .3 1.3 1.1 2.4 2.3 3-.6 0-1.2-.1-1.7-.4.5 1.2 1.6 2.1 2.9 2.4-.6.3-1.3.4-2 .4 1.8 1.2 4.1 1.5 6.2.8 2.7-.9 4.2-3.5 3.5-6.4z" fill="#fff"/><circle cx="12.8" cy="10.2" r=".9" fill="#4D6BFE"/></svg>',
      volcengine: '<svg class="picon" viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#1664FF"/><path d="M5 15.5 10.2 6l3.2 5.6L12 15.5H5z" fill="#fff"/><path d="m13.5 15.5 2.4-4.2L19 15.5h-5.5z" fill="#00D0C6"/></svg>',
      moonshot: '<svg class="picon" viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#111"/><path d="M12 4.5a7.5 7.5 0 1 0 7.4 8.8A6 6 0 0 1 12 4.5z" fill="#fff"/><circle cx="15.5" cy="8" r="2.6" fill="#8B5CF6"/></svg>',
      zhipu: '<svg class="picon" viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#3B5BFF"/><path d="M12 4.6 18.5 12 12 19.4 5.5 12z" fill="none" stroke="#fff" stroke-width="1.6"/><circle cx="12" cy="12" r="2.2" fill="#fff"/></svg>',
      minimax: '<svg class="picon" viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#F23F5D"/><path d="M6 17V7l6 6 6-6v10" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      dashscope: '<svg class="picon" viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#FF6A00"/><circle cx="12" cy="12" r="5.5" fill="none" stroke="#fff" stroke-width="1.8"/><path d="M12 6.5c2.4 1.5 2.4 9.5 0 11" fill="none" stroke="#fff" stroke-width="1.5"/><path d="M6.5 12h11" stroke="#fff" stroke-width="1.5"/></svg>',
      tencent: '<svg class="picon" viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#0052D9"/><path d="M12 5c-4 0-7 2.6-7 5.8 0 1.9 1.1 3.6 2.8 4.6-.1.8-.5 1.7-1.2 2.4 1.4-.2 2.6-.8 3.4-1.4 .6.1 1.3.2 2 .2 4 0 7-2.6 7-5.8S16 5 12 5z" fill="#fff"/></svg>',
      openai: '<svg class="picon" viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#10A37F"/><path d="M12 6.2a3.2 3.2 0 0 1 2.9 1.8l-4.2 2.4a2.2 2.2 0 0 0 0 3.2l4.2 2.4A3.2 3.2 0 0 1 12 17.8a3.2 3.2 0 0 1-2.9-1.8l4.2-2.4a2.2 2.2 0 0 0 0-3.2L9.1 8A3.2 3.2 0 0 1 12 6.2z" fill="none" stroke="#fff" stroke-width="1.4"/><circle cx="12" cy="12" r="6.2" fill="none" stroke="#fff" stroke-width="1.4"/></svg>',
      generic: '<svg class="picon" viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#9CA3AF"/><circle cx="12" cy="12" r="4.5" fill="#fff"/></svg>',
    };
    function iconFor(p) {
      const key = (p.provider || '').toLowerCase();
      if (ICONS[key]) return ICONS[key];
      const name = (p.name || '').toLowerCase();
      if (name.includes('deepseek')) return ICONS.deepseek;
      if (name.includes('火山') || name.includes('豆包') || name.includes('volc')) return ICONS.volcengine;
      if (name.includes('月之暗面') || name.includes('kimi') || name.includes('moonshot')) return ICONS.moonshot;
      if (name.includes('智谱') || name.includes('zhipu') || name.includes('glm')) return ICONS.zhipu;
      if (name.includes('minimax')) return ICONS.minimax;
      if (name.includes('百炼') || name.includes('阿里') || name.includes('dashscope') || name.includes('通义') || name.includes('qwen')) return ICONS.dashscope;
      if (name.includes('腾讯') || name.includes('混元') || name.includes('tencent') || name.includes('hunyuan')) return ICONS.tencent;
      if (name.includes('openai') || name.includes('gpt')) return ICONS.openai;
      return ICONS.generic;
    }

    // ===== 快速添加：已验证的平台预置模板 =====
    // url/jsonPath 为常量已实测通过；用户只需填密钥，也可自行修改
    const QUICK_TEMPLATES = [
      { provider:'deepseek', name:'DeepSeek', currency:'CNY', threshold:200,
        url:'https://api.deepseek.com/user/balance', jsonPath:'balance_infos[0].total_balance',
        hint:'只需填 <b>API Key</b>（在 <a href="https://platform.deepseek.com/api_keys" target="_blank" rel="noopener noreferrer" style="color:var(--brand);">DeepSeek 开放平台「API keys」页</a>创建，sk-开头）。余额为人民币账户总额。' },
      { provider:'volcengine', name:'火山引擎', currency:'CNY', threshold:200,
        hint:'需填两项：<b>API Key</b> 填 <a href="https://console.volcengine.com/iam/accesskey/" target="_blank" rel="noopener noreferrer" style="color:var(--brand);">Access Key ID（AK）</a>，<b>Secret Key</b> 填 <a href="https://console.volcengine.com/iam/accesskey/" target="_blank" rel="noopener noreferrer" style="color:var(--brand);">Secret Access Key（SK）</a>，在控制台「API 访问密钥」页生成；需有费用中心只读权限。查询的是主账户可用余额。' },
      { provider:'moonshot', name:'月之暗面', currency:'CNY', threshold:200,
        url:'https://api.moonshot.cn/v1/users/me/balance', jsonPath:'data.available_balance',
        hint:'只需填 <b>API Key</b>（在 <a href="https://platform.moonshot.cn/console/api-keys" target="_blank" rel="noopener noreferrer" style="color:var(--brand);">月之暗面平台「API Key 管理」页</a>创建）。余额为人民币。' },
      { provider:'minimax', name:'MiniMax', currency:'CNY', threshold:200,
        url:'https://www.minimaxi.com/v1/token_plan/remains', jsonPath:'current_interval_usage_count',
        hint:'<b>Token Plan API Key</b>（在 <a href="https://platform.minimax.cn/console/access?tab=api-keys" target="_blank" rel="noopener noreferrer" style="color:var(--brand);">MiniMax 平台「Token Plan 密钥管理」页</a>创建）：返回当前5小时滚动窗口内剩余的Token请求次数（非人民币）。<br><b>普通开放平台API Key</b>：请手动访问 <a href="https://platform.minimax.cn/console/user-center/balance" target="_blank" rel="noopener noreferrer" style="color:var(--brand);">MiniMax 账户中心</a> 查看余额。' },
      { provider:'zhipu', name:'智谱AI', currency:'CNY', threshold:200,
        hint:'只需填 <b>API Key</b>（在 <a href="https://open.bigmodel.cn/apikey/platform" target="_blank" rel="noopener noreferrer" style="color:var(--brand);">智谱开放平台「API Keys」页</a>创建，格式为 xxxxx.yyyyy）。查询的是智谱AI账户可用余额，单位为人民币。' },
      { provider:'dashscope', name:'阿里云百炼', currency:'CNY', threshold:200,
        hint:'需填两项：<b>API Key</b> 填 <a href="https://ram.console.aliyun.com/manage/ak" target="_blank" rel="noopener noreferrer" style="color:var(--brand);">AccessKey ID</a>，<b>Secret Key</b> 填 <a href="https://ram.console.aliyun.com/manage/ak" target="_blank" rel="noopener noreferrer" style="color:var(--brand);">AccessKey Secret</a>（阿里云 RAM 访问控制台创建；需有 BSS 费用查询权限）。查询的是阿里云账户可用余额。' },
      { provider:'tencent', name:'腾讯云（混元）', currency:'CNY', threshold:200,
        hint:'需填两项：<b>API Key</b> 填 <a href="https://console.cloud.tencent.com/cam/capi" target="_blank" rel="noopener noreferrer" style="color:var(--brand);">SecretId</a>，<b>Secret Key</b> 填 <a href="https://console.cloud.tencent.com/cam/capi" target="_blank" rel="noopener noreferrer" style="color:var(--brand);">SecretKey</a>（腾讯云「访问管理-API密钥管理」页创建）。查询的是腾讯云账户可用余额，单位为人民币。' },
      { provider:'openai', name:'OpenAI', currency:'USD', threshold:10,
        hint:'需填 <b>Admin Key</b>（组织管理员在 <a href="https://platform.openai.com/api-keys" target="_blank" rel="noopener noreferrer" style="color:var(--brand);">platform.openai.com「API Keys」</a>创建，sk-admin 开头）。余额 = 预付总额 - 本月消耗（美元）。国内访问需代理：启动服务前设置环境变量 NODE_USE_ENV_PROXY=1 和 HTTPS_PROXY。' },
      { provider:'mimo', name:'小米多模态（MiMo）', currency:'CNY', threshold:10,
        url:'https://mimo.mi.com/api/v1/balance', jsonPath:'data.balance',
        hint:'只需填 <b>API Key</b>（在 <a href="https://mimo.mi.com/console/access" target="_blank" rel="noopener noreferrer" style="color:var(--brand);">小米多模态平台「API Key 管理」页</a>创建）。' },
    ];

    function renderQuickAdd() {
      const bar = document.querySelector('#quick-add-bar');
      bar.querySelectorAll('.quick-btn').forEach(b => b.remove());
      for (const t of QUICK_TEMPLATES) {
        const btn = document.createElement('button');
        btn.className = 'quick-btn';
        btn.style.cssText = 'display:inline-flex;align-items:center;gap:6px;border:1px solid #d1d5db;border-radius:6px;background:#fff;padding:4px 10px;cursor:pointer;font-size:13px;';
        btn.innerHTML = `${ICONS[t.provider] || ICONS.generic}<span>${t.name}</span>`;
        btn.onclick = () => showQuickForm(t);
        bar.appendChild(btn);
      }
    }
    renderQuickAdd();

    // 快速添加：预填常量，用户只填密钥；按平台隐藏不适用的字段
    // 内置专用查询器（签名类）不需要 URL/JSON path/余额类型；单 key 类不需要 Secret Key
    const FIELD_VISIBILITY = {
      deepseek:  { hide:['key-secret','balance-url','json-path'], keyLabel:'API Key <a href="https://platform.deepseek.com/api_keys" target="_blank" rel="noopener noreferrer" style="font-size:12px;color:var(--brand);margin-left:4px;">查看帮助</a>' },
      moonshot:  { hide:['key-secret','balance-url','json-path'], keyLabel:'API Key <a href="https://platform.moonshot.cn/console/api-keys" target="_blank" rel="noopener noreferrer" style="font-size:12px;color:var(--brand);margin-left:4px;">查看帮助</a>' },
      minimax:   { hide:['key-secret','balance-url','json-path'], keyLabel:'Token Plan API Key <a href="https://platform.minimax.cn/console/access?tab=api-keys" target="_blank" rel="noopener noreferrer" style="font-size:12px;color:var(--brand);margin-left:4px;">查看帮助</a>' },
      mimo:      { hide:['key-secret','balance-url','json-path'], keyLabel:'API Key <a href="https://mimo.mi.com/console/access" target="_blank" rel="noopener noreferrer" style="font-size:12px;color:var(--brand);margin-left:4px;">查看帮助</a>' },
      mimo:      { hide:['key-secret','balance-url','json-path'], keyLabel:'API Key <a href="https://mimo.mi.com/console/access" target="_blank" rel="noopener noreferrer" style="font-size:12px;color:var(--brand);margin-left:4px;">查看帮助</a>' },
      zhipu:     { hide:['balance-url','json-path'], keyLabel:'API Key（模型调用）<a href="https://open.bigmodel.cn/apikey/platform" target="_blank" rel="noopener noreferrer" style="font-size:12px;color:var(--brand);margin-left:4px;">查看帮助</a>', secretLabel:'控制台 Token（JWT）<a href="https://open.bigmodel.cn/" target="_blank" rel="noopener noreferrer" style="font-size:12px;color:var(--brand);margin-left:4px;">查看帮助</a>' },
      volcengine:{ hide:['balance-url','json-path','balance-type'], keyLabel:'Access Key ID（AK）<a href="https://console.volcengine.com/iam/accesskey/" target="_blank" rel="noopener noreferrer" style="font-size:12px;color:var(--brand);margin-left:4px;">查看帮助</a>', secretLabel:'Secret Access Key（SK）<a href="https://console.volcengine.com/iam/accesskey/" target="_blank" rel="noopener noreferrer" style="font-size:12px;color:var(--brand);margin-left:4px;">查看帮助</a>' },
      dashscope: { hide:['balance-url','json-path','balance-type'], keyLabel:'AccessKey ID<a href="https://ram.console.aliyun.com/manage/ak" target="_blank" rel="noopener noreferrer" style="font-size:12px;color:var(--brand);margin-left:4px;">查看帮助</a>', secretLabel:'AccessKey Secret<a href="https://ram.console.aliyun.com/manage/ak" target="_blank" rel="noopener noreferrer" style="font-size:12px;color:var(--brand);margin-left:4px;">查看帮助</a>' },
      tencent:   { hide:['balance-url','json-path','balance-type'], keyLabel:'SecretId<a href="https://console.cloud.tencent.com/cam/capi" target="_blank" rel="noopener noreferrer" style="font-size:12px;color:var(--brand);margin-left:4px;">查看帮助</a>', secretLabel:'SecretKey<a href="https://console.cloud.tencent.com/cam/capi" target="_blank" rel="noopener noreferrer" style="font-size:12px;color:var(--brand);margin-left:4px;">查看帮助</a>' },
      openai:    { hide:['key-secret','balance-url','json-path','balance-type'], keyLabel:'Admin Key（sk-admin 开头）<a href="https://platform.openai.com/api-keys" target="_blank" rel="noopener noreferrer" style="font-size:12px;color:var(--brand);margin-left:4px;">查看帮助</a>' },
      zhipu:     { hide:['key-secret','balance-url','json-path'], keyLabel:'API Key <a href="https://open.bigmodel.cn/apikey/platform" target="_blank" rel="noopener noreferrer" style="font-size:12px;color:var(--brand);margin-left:4px;">查看帮助</a>' },
    };
    function setFieldVisible(name, visible) {
      const el = document.querySelector(`#form-grid [data-field="${name}"]`);
      if (el) el.classList.toggle('hidden', !visible);
    }
    function applyFieldVisibility(provider) {
      const cfg = FIELD_VISIBILITY[provider];
      for (const name of ['key','key-secret','balance-type','balance-url','json-path']) {
        setFieldVisible(name, cfg ? !cfg.hide.includes(name) : true);
      }
      document.querySelector('#f-key-label').innerHTML = cfg?.keyLabel || 'API Key';
      document.querySelector('#f-key-secret-label').innerHTML = cfg?.secretLabel || 'Secret Key（火山 SK，可选）';
    }

    function showQuickForm(t) {
      showAddForm();
      document.querySelector('#form-title').textContent = `快速添加：${t.name}`;
      document.querySelector('#f-name').value = t.name;
      document.querySelector('#f-provider').value = t.provider;
      document.querySelector('#f-balance-type').value = 'api';
      document.querySelector('#f-balance-url').value = t.url || '';
      document.querySelector('#f-json-path').value = t.jsonPath || '';
      document.querySelector('#f-currency').value = t.currency;
      document.querySelector('#f-threshold').value = t.threshold;
      document.querySelector('#f-recharge').value = '500';
      document.querySelector('#f-target').value = '';
      applyFieldVisibility(t.provider);
      const hint = document.querySelector('#form-hint');
      hint.innerHTML = 'ℹ️ ' + t.hint;
      hint.classList.remove('hidden');
      document.querySelector('#add-form').scrollIntoView({ behavior:'smooth' });
    }

    function balanceBadge(balance, threshold) {
      if (balance == null) return '<span class="badge info">未查询</span>';
      if (balance < threshold) return `<span class="badge err">${balance}</span>`;
      return `<span class="badge ok">${balance}</span>`;
    }

    async function loadPlatforms() {
      const list = await api('/api/platforms');
      const tbody = document.querySelector('#platform-table tbody');
      tbody.innerHTML = list.map(p => `
        <tr>
          <td><span class="pname">${iconFor(p)}<b>${esc(p.name)}</b></span></td>
          <td>${esc(p.provider)}</td>
          <td>${balanceBadge(p.latest_balance, p.threshold)} ${esc(p.currency)}</td>
          <td>${p.threshold}</td>
          <td>${p.recharge_amount}</td>
          <td>${p.active ? '<span class="badge ok">启用</span>' : '<span class="badge err">停用</span>'}</td>
          <td class="row-actions">
            <button onclick="refreshOne(${p.id})">刷新余额</button>
            <button onclick="inputBalance(${p.id})">录入余额</button>
            <button onclick="editPlatform(${p.id})">编辑</button>
            <button class="danger" onclick="delPlatform(${p.id})">删除</button>
          </td>
        </tr>
      `).join('');
    }

    async function loadOrders() {
      const list = await api('/api/orders');
      const tbody = document.querySelector('#order-table tbody');
      tbody.innerHTML = list.map(o => `
        <tr>
          <td>#${o.id}</td>
          <td>${esc(o.platform_name)}</td>
          <td>${o.amount} ${esc(o.currency)}</td>
          <td class="${STATUS_CLASS[o.status] || ''}">${STATUS_LABEL[o.status] || o.status}</td>
          <td class="muted">${esc(o.reason || '')}</td>
          <td class="muted">${o.created_at}</td>
          <td class="row-actions">
            ${o.status === 'pending' ? `<button onclick="notifyOrder(${o.id})">发送通知</button>` : ''}
            ${o.status === 'notified' ? `<button class="primary" onclick="markPaid(${o.id})">标记已打款</button>` : ''}
            ${o.status === 'paid' ? `<button class="primary" onclick="tryCredit(${o.id})">检测到账</button> <button onclick="forceCredit(${o.id})">手动确认到账</button>` : ''}
          </td>
        </tr>
      `).join('');
    }

    async function loadFund() {
      const data = await api('/api/fund');
      document.querySelector('#fund-balance').textContent = data.pool.balance;
      document.querySelector('#fund-badge').textContent = `资金池：${data.pool.balance}`;
      const tbody = document.querySelector('#fund-table tbody');
      const typeLabel = { deposit:'预存', recharge_deduct:'充值扣减', adjust:'调整' };
      tbody.innerHTML = data.transactions.map(t => `
        <tr>
          <td>${typeLabel[t.type] || t.type}</td>
          <td style="color:${t.amount>=0?'var(--green)':'var(--red)'}">${t.amount>=0?'+':''}${t.amount}</td>
          <td>${t.balance_after}</td>
          <td class="muted">${esc(t.note||'')}</td>
          <td class="muted">${t.created_at}</td>
        </tr>
      `).join('');
    }

    async function refreshOne(id) { await api(`/api/platforms/${id}/refresh`, { method:'POST' }); loadPlatforms(); }
    async function inputBalance(id) {
      const v = prompt('输入当前余额：');
      if (v == null) return;
      await api(`/api/platforms/${id}/balance`, { method:'POST', body:{ balance: parseFloat(v) } });
      loadPlatforms();
    }
    async function delPlatform(id) {
      if (!confirm('确认删除该平台？')) return;
      await api(`/api/platforms/${id}`, { method:'DELETE' });
      loadPlatforms();
    }

    function showAddForm(){
      editingId = null;
      document.querySelector('#form-title').textContent = '添加平台';
      document.querySelector('#form-hint').classList.add('hidden');
      applyFieldVisibility(null);
      document.querySelector('#f-name').value = '';
      document.querySelector('#f-provider').value = 'generic';
      document.querySelector('#f-key').value = '';
      document.querySelector('#f-key-secret').value = '';
      document.querySelector('#f-balance-type').value = 'api';
      document.querySelector('#f-balance-url').value = '';
      document.querySelector('#f-json-path').value = '';
      document.querySelector('#f-currency').value = 'USD';
      document.querySelector('#f-threshold').value = '200';
      document.querySelector('#f-recharge').value = '500';
      document.querySelector('#f-target').value = '';
      document.querySelector('#add-form').classList.remove('hidden');
    }
    function hideAddForm(){ document.querySelector('#add-form').classList.add('hidden'); }

    let editingId = null;
    async function editPlatform(id) {
      const p = await api(`/api/platforms/${id}`);
      editingId = id;
      document.querySelector('#form-title').textContent = `编辑平台 #${id}`;
      document.querySelector('#f-name').value = p.name || '';
      document.querySelector('#f-provider').value = p.provider || 'generic';
      // 密钥字段：列表接口已掩码，编辑时不回填明文，留空表示保持不变
      document.querySelector('#f-key').value = '';
      document.querySelector('#f-key-secret').value = '';
      document.querySelector('#f-key').placeholder = p.api_key ? '已配置（留空保持不变）' : 'sk-...';
      document.querySelector('#f-key-secret').placeholder = p.api_key_secret ? '已配置（留空保持不变）' : '火山引擎填 Secret Access Key';
      document.querySelector('#f-balance-type').value = p.balance_type || 'api';
      document.querySelector('#f-balance-url').value = p.balance_api_url || '';
      document.querySelector('#f-json-path').value = p.balance_json_path || '';
      document.querySelector('#f-currency').value = p.currency || 'USD';
      document.querySelector('#f-threshold').value = p.threshold ?? 200;
      document.querySelector('#f-recharge').value = p.recharge_amount ?? 500;
      document.querySelector('#f-target').value = p.target_amount ?? '';
      document.querySelector('#add-form').classList.remove('hidden');
      document.querySelector('#add-form').scrollIntoView({ behavior:'smooth' });
    }

    async function savePlatform() {
      const body = {
        name: val('#f-name'), provider: val('#f-provider'), api_key: val('#f-key'),
        api_key_secret: val('#f-key-secret'),
        balance_type: val('#f-balance-type'), balance_api_url: val('#f-balance-url'),
        balance_json_path: val('#f-json-path'), currency: val('#f-currency'),
        threshold: parseFloat(val('#f-threshold')), recharge_amount: parseFloat(val('#f-recharge')),
        target_amount: val('#f-target') ? parseFloat(val('#f-target')) : null,
      };
      // 编辑时，密钥留空则不下发，避免误清空
      if (editingId != null) {
        if (!body.api_key) delete body.api_key;
        if (!body.api_key_secret) delete body.api_key_secret;
      }
      try {
        if (editingId != null) {
          await api(`/api/platforms/${editingId}`, { method:'PUT', body });
        } else {
          await api('/api/platforms', { method:'POST', body });
        }
        editingId = null;
        hideAddForm(); loadPlatforms();
      } catch (e) { alert(e.message); }
    }

    async function runMonitor() { await api('/api/monitor/run', { method:'POST' }); loadPlatforms(); loadOrders(); }
    async function notifyOrder(id) { await api(`/api/orders/${id}/notify`, { method:'POST' }); loadOrders(); }
    async function markPaid(id) { await api(`/api/orders/${id}/paid`, { method:'POST' }); loadOrders(); }
    async function tryCredit(id) {
      try { await api(`/api/orders/${id}/credit`, { method:'POST' }); }
      catch (e) { alert(e.message); }
      loadOrders();
    }
    async function forceCredit(id) { await api(`/api/orders/${id}/credit-force`, { method:'POST' }); loadOrders(); loadFund(); }
    async function deposit() {
      const amount = parseFloat(document.querySelector('#deposit-amount').value);
      if (!amount) return alert('请输入金额');
      await api('/api/fund/deposit', { method:'POST', body:{ amount } });
      document.querySelector('#deposit-amount').value = '';
      loadFund();
    }

    function val(sel) { return document.querySelector(sel).value; }
    function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    // Tab 切换
    document.querySelectorAll('.tab').forEach(t => {
      t.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        const tab = t.dataset.tab;
        ['platforms','orders','fund'].forEach(name => {
          document.querySelector(`#tab-${name}`).classList.toggle('hidden', name !== tab);
        });
        if (tab === 'orders') loadOrders();
        if (tab === 'fund') loadFund();
      });
    });

    loadPlatforms();
    loadFund();
    setInterval(() => { loadPlatforms(); loadFund(); }, 60000);
  </script>
</body>
</html>
